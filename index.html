<style id="app-style">
/* Layout: one left-aligned column, a horizontal sounding line (0 to 7,000 m) that deepens as you score. */
:root{
  --bg:#E8EFF1; --surface:#F5F9FA; --fg:#0A2733; --muted:#4A6571; --line:#B7CBD1;

  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06161E; --surface:#0C2430; --fg:#E4F1F3; --muted:#8FAAB4; --line:#1E3F4C;
  --accent:#FF6A3D; --on-accent:#1B0A03; --danger:#FF8A80;

  --t-plankton:#8FAAB4; --t-clever:#B79AE0; --t-schooler:#4FC3C0; --t-rare:#6FA3FF; --t-deep:#9A8CFF; --t-gem:#FF7A52;
  color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

a{color:inherit}

.brand{font-family:var(--f-mono);font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.tabs{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tabs a{padding:6px 16px;text-decoration:none;font-weight:600;font-size:.9rem;background:var(--surface)}
.tabs a.on{background:var(--fg);color:var(--bg)}
h1,h2,h3{text-wrap:balance;margin:0}
.hero{padding-block:36px 8px;display:grid;gap:16px;justify-items:start}

.track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(14.2857% - 1px),var(--bg) calc(14.2857% - 1px),var(--bg) 14.2857%);opacity:.55;pointer-events:none}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:30px}
.tline{height:4px;background:var(--line);margin-top:8px;border-radius:2px;overflow:hidden}
.tline i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(1)}
.q{font-family:var(--f-display);font-weight:600;font-size:clamp(1.4rem,4.8vw,2.1rem);line-height:1.18;letter-spacing:-.02em;margin:22px 0 18px}
.ask{display:flex;gap:10px;flex-wrap:wrap}
input[type=text],input[type=number],textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}

.ask input{flex:1 1 220px;width:auto;font-size:1.15rem;padding:12px 14px}
.hint{color:var(--muted);font-size:.88rem;margin:10px 0 0}
.result{margin-top:26px;padding:16px;border:1px solid var(--line);border-left:6px solid var(--c);background:var(--surface);border-radius:4px;display:grid;gap:6px}
.result .pts{font-family:var(--f-display);font-weight:800;font-size:2rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.result p{margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.recap{margin-top:24px;display:grid;border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .qq{font-weight:600}
.rrow .aa{color:var(--muted);font-size:.9rem;grid-column:1/-1;overflow-wrap:anywhere}
.rrow .pp{font-family:var(--f-mono);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
.final{margin-top:30px}
.final .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,10vw,4.2rem);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.sec{margin-top:26px;display:grid;gap:14px}
.sec h2{font-family:var(--f-display);font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
.fld{display:grid;gap:6px;min-width:0}
.fld label,.fld .lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld .lab em{font-style:normal;color:var(--fg)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 9rem;gap:14px}
.pcard{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:14px;display:grid;gap:14px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.phead .tools{display:flex;gap:6px;flex-wrap:wrap}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.tiers .fld .lab{display:flex;align-items:center;gap:8px}
.tiers .fld .lab i{width:10px;height:10px;background:var(--c);flex:none}
.pubbar{position:sticky;bottom:0;margin-top:28px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.pubbar p{margin:0}
.err{color:var(--danger);font-size:.88rem;margin-top:4px}
.share{margin:22px 0 0;font-size:.9rem;color:var(--muted);max-width:62ch}
@media (max-width:520px){.rung{grid-template-columns:minmax(0,1fr) 3.5rem 4.5rem}.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}

(function(){

var HEAD='<title>Dive Maker</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="'+FONTS+'">\n';

var TIERS=[
 {k:"plankton",name:"Plankton",pts:10,c:"var(--t-plankton)",note:"The answer everyone blurts out.",hint:"Obvious answers."},

 {k:"gem",name:"One in a Krillion",pts:100,c:"var(--t-gem)",note:"The prize answer for this prompt.",hint:"The single best find."}
];
var ZONES=[[0,"Sunlight zone"],[200,"Twilight zone"],[1000,"Midnight zone"],[4000,"Abyssal zone"],[6000,"Hadal zone"]];
var FLOOR=7000;

function T(a){var o={};["plankton","clever","schooler","rare","deep","gem"].forEach(function(k,i){o[k]=a[i]||[]});return o}
var EXAMPLE={
 title:"Kitchen Table Dive",
 tagline:"Three prompts. The rarer the answer you land on, the deeper you go. This is a sample dive, so replace everything in Build.",
 secs:25,
 prompts:[
  {q:"Name a pasta shape",tiers:T([
    ["spaghetti","penne","macaroni"],[ "noodles"],
    ["fettuccine","linguine","rigatoni","farfalle","ravioli","fusilli","tortellini"],
    ["orecchiette","pappardelle","gnocchi","cavatappi","ziti","orzo","conchiglie | shells"],
    ["bucatini","paccheri","casarecce","trofie","strozzapreti","mafaldine","tagliatelle"],
    ["corzetti | corzetti stampati"]])},
  {q:"Name something you ride while standing up",tiers:T([
    ["skateboard","scooter"],["subway | metro | train","bus"],
    ["surfboard","escalator","snowboard","skis","wakeboard"],
    ["segway","hoverboard","paddleboard","moving walkway | travelator","longboard"],
    ["onewheel","sandboard","hydrofoil","jet ski","zipline","flowrider"],
    ["efoil | e-foil | electric hydrofoil"]])},
  {q:"Name a part of a ship",tiers:T([
    ["deck","hull","mast","anchor","sail"],["porthole"],
    ["bow","stern","rudder","bridge","helm","propeller","cabin","crows nest"],
    ["keel","galley","bulkhead","hatch","poop deck","gangway","bilge"],
    ["gunwale","capstan","windlass","transom","bulwark","forecastle | focsle"],

};

var $=function(s){return document.querySelector(s)};
var root=$("#root");
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var clone=function(o){return JSON.parse(JSON.stringify(o))};

function fix(c){
 c=c&&typeof c==="object"?c:{};
 c.title=typeof c.title==="string"?c.title:"Untitled dive";
 c.tagline=typeof c.tagline==="string"?c.tagline:"";
 c.secs=Math.min(60,Math.max(10,parseInt(c.secs,10)||25));
 c.prompts=Array.isArray(c.prompts)?c.prompts:[];
 c.prompts.forEach(function(p){
  p.q=typeof p.q==="string"?p.q:"";

  TIERS.forEach(function(t){p.tiers[t.k]=Array.isArray(p.tiers[t.k])?p.tiers[t.k].map(String):[]});

}

var cfg;

var draft=clone(cfg);

var ui={busy:false,err:""};

/* answer matching */
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/&/g," and ").replace(/['’`]/g,"").replace(/[^a-z0-9]+/g," ").trim().replace(/^(the|a|an) /,"")}

 if(a===b)return 0;var m=a.length,n=b.length;if(!m)return n;if(!n)return m;

  (p.tiers[t.k]||[]).forEach(function(entry){

    if(d<=lim&&(!best||d<best.d||(d===best.d&&t.pts>best.t.pts)))best={t:t,d:d};
   });
  });
 });

}

/* helpers */
function meters(pts,n){return Math.round(pts*FLOOR/(Math.max(1,n)*100))}

function renderPlay(){

  });

  h+=gauge(total(),n);
  h+='<div class="qhead"><span class="mono">Prompt '+(play.i+1)+' of '+n+'</span><span class="mono" id="tnum">'+c.secs.toFixed(1)+' s</span></div><div class="tline"><i id="tbar"></i></div>';
  h+='<h2 class="q">'+esc(p.q)+'</h2><form id="af" class="ask"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type an answer" aria-label="Your answer"><button class="btn" type="submit">Lock in</button></form><p class="err" id="miss" role="status"></p><p class="hint">Rarer answers dive deeper. Skip the first thing that comes to mind.</p>';
  return h;
 }
 if(play.phase==="reveal"){
  var r=play.results[play.results.length-1],isLast=play.i>=n-1,pp=c.prompts[play.i];
  h+=gauge(total()-r.pts,n);
  h+='<div class="qhead"><span class="mono">Prompt '+(play.i+1)+' of '+n+'</span></div><h2 class="q">'+esc(pp.q)+'</h2>';
  if(r.tier){
   h+='<div class="result" style="--c:'+r.tier.c+'">'+badge(r.tier)+'<span class="pts">+'+r.pts+' pts &middot; +'+fmt(meters(r.pts,n))+' m</span><p>'+esc(r.answer)+' &mdash; '+esc(r.tier.note)+'</p></div>';
  }else{
   h+='<div class="result" style="--c:var(--line)"><span class="badge">Not on the sheet</span><span class="pts">+0 pts</span><p>'+(r.answer?esc(r.answer)+' is not an answer this dive accepts.':'No answer in time.')+'</p></div>';
  }
  h+='<div class="actions"><button class="btn" data-act="next" id="nx">'+(isLast?"See your depth":"Next prompt")+'</button></div>';
  return h;
 }
 /* end */
 var pts=total(),m=meters(pts,n);
 h+='<section class="final"><p class="mono">You reached</p><div class="big">'+fmt(m)+' m</div><p class="tag" style="margin-top:10px">'+zone(m)+' &middot; '+pts+' of '+(n*100)+' points</p></section>';
 h+=gauge(pts,n).replace('class="gauge"','class="gauge" style="margin-top:18px"');
 h+='<div class="recap">';
 play.results.forEach(function(r,i){
  var pr=c.prompts[i];
  h+='<div class="rrow"><span class="qq">'+esc(pr.q)+'</span><span class="pp">'+r.pts+' pts</span><span class="aa">'+(r.tier?badge(r.tier)+' &middot; ':'Not on the sheet &middot; ')+(r.answer?esc(r.answer):'no answer')+'</span></div>';
 });
 h+='</div><div class="actions"><button class="btn" data-act="again" id="ag">Dive again</button><button class="btn ghost" data-act="copy" id="cp">Copy my result</button></div>';
 return h;
}

/* build */
function renderBuild(){
 var d=draft,h="";
 h+='<section class="sec"><h2>Your dive</h2><div class="row2"><div class="fld"><label for="f-title">Title</label><input type="text" id="f-title" data-f="title" value="'+esc(d.title)+'" maxlength="80"></div><div class="fld"><label for="f-secs">Seconds per prompt</label><input type="number" id="f-secs" data-f="secs" min="10" max="60" value="'+d.secs+'"></div></div>';
 h+='<div class="fld"><label for="f-tag">Intro line</label><input type="text" id="f-tag" data-f="tagline" value="'+esc(d.tagline)+'" maxlength="240"></div></section>';
 h+='<section class="sec"><h2>Prompts and answers</h2><p class="share" style="margin:0">Write each accepted answer on its own line. Put several spellings on one line with a bar between them, like <b>e-foil | efoil</b>. Players get points for the highest tier an answer appears in. Anything not listed scores zero.</p>';
 d.prompts.forEach(function(p,i){
  h+='<div class="pcard"><div class="phead"><span class="mono">Prompt '+(i+1)+'</span><span class="tools"><button class="btn ghost sm" data-act="up" data-i="'+i+'"'+(i===0?' disabled':'')+'>Move up</button><button class="btn ghost sm" data-act="down" data-i="'+i+'"'+(i===d.prompts.length-1?' disabled':'')+'>Move down</button><button class="btn ghost sm" data-act="rm" data-i="'+i+'">Remove</button></span></div>';
  h+='<div class="fld"><label for="q'+i+'">Prompt</label><input type="text" id="q'+i+'" data-f="q" data-i="'+i+'" value="'+esc(p.q)+'" placeholder="Name a ..."></div><div class="tiers">';
  TIERS.slice().sort(function(a,b){return a.pts-b.pts}).forEach(function(t){
   h+='<div class="fld" style="--c:'+t.c+'"><span class="lab"><i></i><em>'+esc(t.name)+'</em> '+t.pts+' pts</span><textarea id="t'+i+t.k+'" data-f="tier" data-i="'+i+'" data-k="'+t.k+'" aria-label="'+esc(t.name)+' answers for prompt '+(i+1)+'" placeholder="'+esc(t.hint)+'">'+esc((p.tiers[t.k]||[]).join("\n"))+'</textarea></div>';
  });
  h+='</div></div>';
 });
 h+='<div class="actions" style="margin:0"><button class="btn ghost" data-act="add">Add a prompt</button><button class="btn ghost" data-act="example">Reset to the sample dive</button></div></section>';
 h+='<p class="share">To send your dive, publish it here, then use Share in the app and copy the link. Anyone who opens the link plays your prompts and sees only the game. Only you see Build.</p>';
 h+='<div class="pubbar"><div><p class="mono" id="dirty"></p><p class="err" id="err" role="alert"></p></div><div class="actions" style="margin:0"><a class="btn ghost" href="#play" style="text-decoration:none">Test play</a><button class="btn" data-act="publish" id="pub">Publish dive</button></div></div>';
 return h;
}
function refreshBar(){
 var a=$("#dirty"),b=$("#pub"),e=$("#err");
 if(a)a.textContent=ui.busy?"Publishing...":(dirty()?"Unpublished changes":"Matches the live dive");
 if(b)b.disabled=ui.busy||!dirty();
 if(e)e.textContent=ui.err||"";
}

function render(){
 clearInterval(play.tid);
 root.innerHTML=top()+(view==="build"&&canEdit?renderBuild():renderPlay());
 document.title=(active().title||"Dive Maker");
 if(view==="build"){refreshBar();return}
 var c=active(),n=c.prompts.length;
 if(play.phase==="ask"){
  var inp=$("#ans");if(inp)inp.focus();
  play.deadline=performance.now()+c.secs*1000;
  play.tid=setInterval(tick,100);
 }else if(play.phase==="reveal"){
  var r=play.results[play.results.length-1];
  requestAnimationFrame(function(){requestAnimationFrame(function(){
   var f=$("#gfill"),g=$("#gnum"),z=$("#gzone"),m=meters(total(),n);
   if(f)f.style.width=Math.min(100,m/FLOOR*100)+"%";
   if(g)g.textContent=fmt(m);
   if(z)z.textContent=zone(m);
  })});
  var nx=$("#nx");if(nx)nx.focus();
 }else if(play.phase==="intro"){var go=$("#go");if(go&&!canEdit)go.focus()}
}
function tick(){
 var c=active(),left=Math.max(0,play.deadline-performance.now());
 var bar=$("#tbar"),num=$("#tnum");
 if(bar)bar.style.transform="scaleX("+(left/(c.secs*1000))+")";
 if(num)num.textContent=(left/1000).toFixed(1)+" s";
 if(left<=0){var i=$("#ans");submit((i&&i.value.trim())||play.lastMiss||"")}
}
function submit(text){
 if(play.phase!=="ask")return;
 clearInterval(play.tid);
 var c=active(),p=c.prompts[play.i],t=judge(p,text);
 play.results.push({answer:String(text).trim(),tier:t,pts:t?t.pts:0});play.lastMiss="";
 play.phase="reveal";render();
}

/* publishing */
function validate(c){
 var e=[];
 if(!c.title.trim())e.push("Add a title.");
 if(!c.prompts.length)e.push("Add at least one prompt.");
 c.prompts.forEach(function(p,i){
  if(!p.q.trim())e.push("Prompt "+(i+1)+" needs a question.");
  if(!TIERS.some(function(t){return (p.tiers[t.k]||[]).length}))e.push("Prompt "+(i+1)+" needs at least one accepted answer.");
 });
 return e;
}
function buildDoc(c){
 var css=$("#app-style").textContent,js=$("#app-js").textContent;
 var data=JSON.stringify(c).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+HEAD+'<style id="app-style">'+css+'</style>\n<div class="wrap" id="root"></div>\n<script type="application/json" id="cfg">'+data+'<\/script>\n<script id="app-js">'+js+'<\/script></body></html>';
}
function publish(){
 var errs=validate(draft);
 if(errs.length){ui.err=errs.join(" ");refreshBar();return}
 ui.busy=true;ui.err="";refreshBar();
 var cl=window.claude&&window.claude.use?window.claude.use("artifact"):Promise.resolve(null);
 cl.then(function(art){
  if(!art)throw {code:"not_granted"};
  return art.publish(buildDoc(draft));
 }).then(function(){
  try{localStorage.removeItem(DK)}catch(e){}
 }).catch(function(e){
  ui.busy=false;
  var code=e&&e.code;
  ui.err=code==="conflict"?"":(code==="not_writer"||code==="not_granted"||code==="not_declared")?"This view cannot save changes. Open the page from your own account to publish.":code==="rate_limited"?"Publishing too fast. Wait a few seconds and try again.":"Publishing failed. Try again in a moment.";
  refreshBar();
 });
}

/* events */
root.addEventListener("input",function(e){
 var el=e.target,f=el.getAttribute&&el.getAttribute("data-f");if(!f||!canEdit)return;
 var i=parseInt(el.getAttribute("data-i"),10);
 if(f==="title")draft.title=el.value;
 else if(f==="tagline")draft.tagline=el.value;
 else if(f==="secs")draft.secs=Math.min(60,Math.max(10,parseInt(el.value,10)||25));
 else if(f==="q")draft.prompts[i].q=el.value;
 else if(f==="tier")draft.prompts[i].tiers[el.getAttribute("data-k")]=el.value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
 ui.err="";saveDraft();refreshBar();
});
root.addEventListener("submit",function(e){
 if(e.target.id==="af"){e.preventDefault();var inp=$("#ans"),v=inp.value.trim();if(!v)return;if(judge(active().prompts[play.i],v)){submit(v)}else{play.lastMiss=v;inp.value="";inp.focus();var ms=$("#miss");if(ms)ms.textContent='"'+v+'" is not on the sheet. Keep trying.'}}
});
root.addEventListener("click",function(e){
 var b=e.target.closest&&e.target.closest("[data-act]");if(!b)return;
 var a=b.getAttribute("data-act"),i=parseInt(b.getAttribute("data-i"),10),n=active().prompts.length;
 if(a==="start"||a==="again"){play={phase:"ask",i:0,results:[],deadline:0,tid:0};render()}
 else if(a==="next"){if(play.i>=n-1){play.phase="end"}else{play.i++;play.phase="ask"}render()}
 else if(a==="copy"){
  var m=meters(total(),n),txt="I reached "+fmt(m)+" m ("+zone(m)+") on "+active().title+".\n"+play.results.map(function(r,i){return (i+1)+". "+(r.tier?r.tier.name:"Not on the sheet")}).join("\n");
  var done=function(ok){b.textContent=ok?"Copied":"Select and copy: "+txt};
  try{navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)})}catch(err){done(false)}
 }
 else if(a==="publish")publish();
 else if(canEdit){
  if(a==="add")draft.prompts.push({q:"",tiers:T([])});
  else if(a==="rm")draft.prompts.splice(i,1);
  else if(a==="up"&&i>0){var t=draft.prompts[i];draft.prompts[i]=draft.prompts[i-1];draft.prompts[i-1]=t}
  else if(a==="down"&&i<draft.prompts.length-1){var u=draft.prompts[i];draft.prompts[i]=draft.prompts[i+1];draft.prompts[i+1]=u}
  else if(a==="example")draft=fix(clone(EXAMPLE));
  else return;
  ui.err="";saveDraft();render();
 }
});
function route(){
 var h=location.hash.replace("#","");
 var v=(h==="build"&&canEdit)?"build":"play";
 if(v!==view||!root.firstChild){view=v;if(v==="play"&&play.phase!=="intro"&&play.phase!=="end"){}render()}
 else render();
}
window.addEventListener("hashchange",function(){
 var h=location.hash.replace("#","");
 view=(h==="build"&&canEdit)?"build":"play";
 if(view==="play")play={phase:"intro",i:0,results:[],deadline:0,tid:0};
 render();
});

render();
try{
 var uc=window.claude&&window.claude.use?window.claude.use("user"):null;
 if(uc)uc.then(function(u){return u?u.canEdit():false}).then(function(ok){
  if(ok){canEdit=true;loadDraft();route()}
 }).catch(function(){});
}catch(e){}
})();
</script></body></html>
